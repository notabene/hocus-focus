<div class="rules">
	<p><span class="oh-no">Oh non&nbsp;!</span> Un méchant <del>développeur</del>… hum, <ins><span class="char" style="color:#ecedf0;"><span aria-hidden="true">👻</span> fantôme</span></ins> a volé les styles de <code>:focus</code>.</p>
</div>
<form action="/3/">
	<div class="game has-startup-styles">
		<div class="scoreboard">
			<span class="level">Niveau 2</span>
			<span class="timer">00:00.00</span>
		</div>
		<button type="button" class="icon is-start" autofocus="autofocus"><span role="img" aria-label="Magicienne">🧙‍♀️</span> <span class="badge">Départ</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Boule de cristal">🔮</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Serpent">🐍</span></button>
		<button type="submit" class="icon is-finish"><span role="img" aria-label="Citrouille">🎃</span> <span class="badge">Arrivée</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Chouette">🦉</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Fleur fanée">🥀</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Bougie">🕯️</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Araignée">🕷️</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Chauve-souris">🦇</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Marron">🌰</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Toile d'araignée">🕸️</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Feuille tombée">🍂</span></button>
		<button type="button" class="icon"><span role="img" aria-label="Cercueil">⚰️</span></button>
		<button type="button" class="icon is-ghost"><span class="ghost" role="img" aria-label="Fantôme">👻</span></button>
	</div>
</form>
<style>
	.has-startup-styles .icon:not(.is-start) { animation: highlightBorder ease-in-out 1s 0.4s; }
	.has-startup-styles .icon:not([class*="is-"]):nth-child(2n+1) { animation-delay: 0.3s; }
	.has-startup-styles .icon:not([class*="is-"]):nth-child(3n+3) { animation-delay: 0.2s; }
	.has-startup-styles .icon.is-ghost { animation-delay: 0.5s; }
	.has-startup-styles .ghost { animation:shakeY ease-in-out 0.5s 1s; }
	.oh-no { display:inline-block; font-weight:bold; animation:headShake ease-in-out 0.5s; }

	@keyframes highlightBorder {
		from { border-color:#3d3836; }
		50% { border-color:#75bfff; }
		to { border-color:#3d3836; }
	}
</style>
<script>
	document.querySelector('.ghost').addEventListener('animationend', function() {
		document.querySelector('.has-startup-styles').classList.remove('has-startup-styles');
	}, { once:true });
</script>
